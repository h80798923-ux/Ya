name: Build BaseLinux Alpine ISO (robust)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WORK: ${{ github.workspace }}/baselinux
      KERNEL_VER: "6.6.15"
      KERNEL_JOBS: "2"    # değiştir: runner kaynaklarına göre 1/2/4
      ISO_NAME: "BaseLinux.iso"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies (apt)
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            squashfs-tools xorriso wget cpio ca-certificates rsync git

      - name: Show runner resources & disk
        run: |
          echo "== Runner info =="
          uname -a
          lscpu || true
          df -h || true
          free -m || true

      - name: Prepare workspace
        run: |
          set -euo pipefail
          echo "WORK=${WORK}"
          sudo rm -rf "${WORK}" || true
          mkdir -p "${WORK}/"{rootfs,iso,kernel,logs}
          ls -la "${WORK}"

      - name: Download Alpine minirootfs (with retry)
        run: |
          set -euo pipefail
          cd "${WORK}"
          URL="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-3.21.0-x86_64.tar.gz"
          for i in 1 2 3; do
            wget -c "$URL" -O alpine-minirootfs.tar.gz && break || sleep 5
          done
          tar -xzf alpine-minirootfs.tar.gz -C rootfs
          echo "rootfs top-level entries:" > logs/rootfs-list.txt
          ls -la rootfs >> logs/rootfs-list.txt
          tail -n +1 logs/rootfs-list.txt

      - name: Write /etc/os-release (BaseLinux)
        run: |
          set -euo pipefail
          cat > "${WORK}/rootfs/etc/os-release" <<'EOF'
NAME="BaseLinux"
ID=baselinux
VERSION="1.0"
VERSION_ID="1.0"
PRETTY_NAME="BaseLinux 1.0"
HOME_URL="https://baselinux.example.com"
EOF
          echo "/etc/os-release written"

      - name: Download kernel sources (with retry)
        run: |
          set -euo pipefail
          cd "${WORK}"
          K=linux-${KERNEL_VER}
          for i in 1 2 3; do
            wget -c "https://cdn.kernel.org/pub/linux/kernel/v6.x/${K}.tar.xz" -O "${K}.tar.xz" && break || sleep 5
          done
          tar -xf "${K}.tar.xz"
          ls -la "${WORK}/${K}" > logs/kernel-tree.txt

      - name: Build kernel (logged, limited jobs)
        run: |
          set -euo pipefail
          cd "${WORK}/linux-${KERNEL_VER}"
          # use defconfig; reduce parallelism to be safe on GitHub runner
          make defconfig
          make -j"${KERNEL_JOBS}" 2>&1 | tee "${WORK}/logs/kernel-build.log"
          make modules_install INSTALL_MOD_PATH="${WORK}/kernel" 2>&1 | tee -a "${WORK}/logs/kernel-build.log"
          mkdir -p "${WORK}/kernel/boot"
          cp arch/x86/boot/bzImage "${WORK}/kernel/boot/vmlinuz" || (echo "vmlinuz missing" && exit 1)
          echo "Kernel built, vmlinuz size:" && ls -lh "${WORK}/kernel/boot/vmlinuz"

      - name: Create minimal initramfs (cpio) and copy vmlinuz
        run: |
          set -euo pipefail
          mkdir -p "${WORK}/iso/live/initramfs-temp"
          cd "${WORK}/iso/live/initramfs-temp"
          mkdir -p {bin,sbin,etc,proc,sys,usr,lib,lib64}
          # copy kernel modules if present (guarded)
          if [ -d "${WORK}/kernel/lib/modules" ]; then
            cp -r "${WORK}/kernel/lib/modules" lib/ || true
          fi
          # include a tiny busybox if available (optional)
          if command -v busybox >/dev/null 2>&1; then
            cp "$(command -v busybox)" bin/ || true
          fi
          find . | cpio -H newc -o | gzip > "${WORK}/iso/live/initrd"
          cd "${WORK}"
          cp "${WORK}/kernel/boot/vmlinuz" "${WORK}/iso/live/vmlinuz"
          ls -lh "${WORK}/iso/live/" > "${WORK}/logs/live-list.txt"
          tail -n +1 "${WORK}/logs/live-list.txt"

      - name: Pack rootfs into SquashFS and verify
        run: |
          set -euo pipefail
          if [ ! -d "${WORK}/rootfs" ]; then
            echo "ERROR: rootfs missing" >&2
            exit 1
          fi
          mksquashfs "${WORK}/rootfs" "${WORK}/iso/live/filesystem.squashfs" -e boot -noappend
          echo "squashfs created"
          ls -lh "${WORK}/iso/live/filesystem.squashfs" > "${WORK}/logs/squashfs-list.txt"
          tail -n +1 "${WORK}/logs/squashfs-list.txt"

      - name: Create GRUB config
        run: |
          set -euo pipefail
          mkdir -p "${WORK}/iso/boot/grub"
          cat > "${WORK}/iso/boot/grub/grub.cfg" <<'EOF'
set timeout=5
menuentry "BaseLinux Alpine CLI" {
  linux /live/vmlinuz boot=live quiet
  initrd /live/initrd
}
EOF
          echo "grub.cfg:"
          sed -n '1,120p' "${WORK}/iso/boot/grub/grub.cfg"

      - name: Preflight checks before ISO
        run: |
          set -euo pipefail
          echo "Checking existence:"
          test -f "${WORK}/iso/live/vmlinuz" || (echo "MISSING: vmlinuz" && exit 1)
          test -f "${WORK}/iso/live/initrd" || (echo "MISSING: initrd" && exit 1)
          test -f "${WORK}/iso/live/filesystem.squashfs" || (echo "MISSING: filesystem.squashfs" && exit 1)
          echo "All prechecks passed."

      - name: Build ISO (xorriso)
        run: |
          set -euo pipefail
          cd "${WORK}"
          xorriso -as mkisofs -o "${WORK}/${ISO_NAME}" -volid "BaseLinux" iso
          ls -lh "${WORK}/${ISO_NAME}" > "${WORK}/logs/iso-info.txt"
          tail -n +1 "${WORK}/logs/iso-info.txt"

      - name: Upload artifacts (ISO + logs + kernel log)
        uses: actions/upload-artifact@v4
        with:
          name: BaseLinux-artifacts
          path: |
            ${{ github.workspace }}/baselinux/BaseLinux.iso
            ${{ github.workspace }}/baselinux/logs/**
            ${{ github.workspace }}/baselinux/kernel-build.log
